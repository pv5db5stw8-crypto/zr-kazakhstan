<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ZR Kazakhstan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f0eb; color: #2d2a24; min-height: 100vh; padding: 16px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #fff; border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo-text { font-size: 24px; font-weight: 700; color: #c9a84c; letter-spacing: 3px; }
        .logo-sub { font-size: 13px; color: #888; letter-spacing: 2px; }
        .card-title { font-size: 20px; font-weight: 600; margin-bottom: 16px; text-align: center; }
        .input { width: 100%; padding: 14px 16px; border: 2px solid #e8e0d8; border-radius: 12px; background: #f8f5f0; font-size: 16px; margin-bottom: 12px; outline: none; }
        .input:focus { border-color: #c9a84c; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; color: #fff; background: #c9a84c; cursor: pointer; margin-bottom: 8px; }
        .btn-danger { background: #e74c3c; }
        .btn-secondary { background: transparent; color: #c9a84c; border: 2px solid #c9a84c; }
        .error { background: rgba(231,76,60,0.1); color: #e74c3c; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .success { background: rgba(39,174,96,0.1); color: #27ae60; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .hidden { display: none; }
        .switch-link { text-align: center; margin-top: 16px; color: #c9a84c; cursor: pointer; font-weight: 500; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .header-title { font-size: 20px; font-weight: bold; }
        .header-sub { font-size: 14px; color: #888; }
        .logout-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #e74c3c; color: #fff; font-size: 18px; cursor: pointer; }
        .record { background: #f8f5f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #c9a84c; }
        .record-roll { font-size: 16px; font-weight: 600; }
        .record-warranty { font-size: 14px; color: #c9a84c; margin-top: 2px; }
        .record-date { font-size: 12px; color: #888; margin-top: 4px; }
        .flex { display: flex; gap: 10px; align-items: center; }
        .flex-1 { flex: 1; }
        .scan-btn { width: auto; padding: 14px 16px; border: none; border-radius: 12px; background: #c9a84c; color: #fff; font-size: 20px; cursor: pointer; }
        .phone-prefix { display: inline-block; margin-right: 8px; font-weight: 600; }
        @media (prefers-color-scheme: dark) {
            body { background: #0a0a12; color: #e8e4de; }
            .card { background: #16161f; }
            .input { background: #222233; color: #e8e4de; border-color: #333355; }
            .input:focus { border-color: #c9a84c; }
            .record { background: #1a1a2e; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Логотип -->
        <div class="logo">
            <div class="logo-text">🏭 ZR KAZAKHSTAN</div>
            <div class="logo-sub">Гарантия качества</div>
        </div>

        <!-- ===== ЭКРАН ВХОДА ===== -->
        <div id="authScreen">
            <div class="card">
                <div class="card-title" id="authTitle">🔐 Авторизация</div>
                <div id="authError" class="error hidden"></div>
                <div id="authSuccess" class="success hidden"></div>
                <input class="input" id="loginInput" placeholder="Логин (минимум 6 символов)">
                <input class="input" id="passwordInput" placeholder="Пароль" type="password">
                <div id="registerFields" class="hidden">
                    <input class="input" id="confirmPasswordInput" placeholder="Подтвердите пароль" type="password">
                    <div>
                        <span class="phone-prefix">+7</span>
                        <input class="input" id="phoneInput" placeholder="7001234567" type="tel" style="display:inline-block; width:calc(100% - 40px);">
                    </div>
                </div>
                <button class="btn" id="authBtn">Войти</button>
                <div class="switch-link" id="switchLink">Нет аккаунта? Зарегистрироваться</div>
                <div style="text-align:center; margin-top:12px; font-size:13px; color:#888;">Админ: admin / admin123</div>
            </div>
        </div>

        <!-- ===== ЭКРАН ПОЛЬЗОВАТЕЛЯ ===== -->
        <div id="userScreen" class="hidden">
            <div class="card">
                <div class="header">
                    <div>
                        <div class="header-title">📦 Архив плёнок</div>
                        <div class="header-sub" id="userNameDisplay">👤 пользователь</div>
                    </div>
                    <button class="logout-btn" id="logoutBtn">🚪</button>
                </div>
                <div class="flex">
                    <input class="input flex-1" id="rollInput" placeholder="Номер рулона">
                    <button class="scan-btn" id="scanBtn">📷</button>
                </div>
                <input class="input" id="warrantyInput" placeholder="Номер гарантийного талона">
                <div id="userError" class="error hidden"></div>
                <button class="btn" id="addRecordBtn">➕ Добавить плёнку</button>
            </div>
            <div style="font-weight:600; margin: 16px 0 10px;">📜 Мои плёнки (<span id="userCount">0</span>)</div>
            <div id="userRecords"></div>
        </div>
    </div>

    <script>
        // ============================================
        // === ПРОСТОЙ РАБОЧИЙ КОД (БЕЗ ОШИБОК) ===
        // ============================================

        // ----- Состояние -----
        const state = {
            users: JSON.parse(localStorage.getItem('zr_users') || '{}'),
            films: JSON.parse(localStorage.getItem('zr_films') || '[]'),
            currentUser: null,
            isRegisterMode: false,
        };

        // ----- DOM -----
        const $ = id => document.getElementById(id);
        const authScreen = $('authScreen');
        const userScreen = $('userScreen');
        const authTitle = $('authTitle');
        const authError = $('authError');
        const authSuccess = $('authSuccess');
        const loginInput = $('loginInput');
        const passwordInput = $('passwordInput');
        const confirmPasswordInput = $('confirmPasswordInput');
        const phoneInput = $('phoneInput');
        const registerFields = $('registerFields');
        const authBtn = $('authBtn');
        const switchLink = $('switchLink');
        const userNameDisplay = $('userNameDisplay');
        const rollInput = $('rollInput');
        const warrantyInput = $('warrantyInput');
        const userError = $('userError');
        const addRecordBtn = $('addRecordBtn');
        const userCount = $('userCount');
        const userRecords = $('userRecords');
        const logoutBtn = $('logoutBtn');
        const scanBtn = $('scanBtn');

        // ----- Сохранение -----
        function saveData() {
            localStorage.setItem('zr_users', JSON.stringify(state.users));
            localStorage.setItem('zr_films', JSON.stringify(state.films));
        }

        // ----- Показать экраны -----
        function showAuthScreen() {
            authScreen.classList.remove('hidden');
            userScreen.classList.add('hidden');
        }

        function showUserScreen() {
            authScreen.classList.add('hidden');
            userScreen.classList.remove('hidden');
            userNameDisplay.textContent = '👤 ' + state.currentUser;
            renderRecords();
        }

        // ----- Ошибки -----
        function showError(el, msg) {
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function hideErrors() {
            authError.classList.add('hidden');
            authSuccess.classList.add('hidden');
            userError.classList.add('hidden');
        }

        // ----- Переключение режима -----
        function toggleMode() {
            state.isRegisterMode = !state.isRegisterMode;
            authTitle.textContent = state.isRegisterMode ? '📝 Регистрация' : '🔐 Авторизация';
            authBtn.textContent = state.isRegisterMode ? 'Зарегистрироваться' : 'Войти';
            switchLink.textContent = state.isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
            registerFields.classList.toggle('hidden');
            hideErrors();
            loginInput.value = '';
            passwordInput.value = '';
            confirmPasswordInput.value = '';
            phoneInput.value = '';
        }

        // ----- Вход / Регистрация -----
        function handleAuth() {
            hideErrors();
            const login = loginInput.value.trim();
            const password = passwordInput.value.trim();

            if (!login || !password) {
                showError(authError, '❌ Заполните логин и пароль');
                return;
            }

            // --- РЕГИСТРАЦИЯ ---
            if (state.isRegisterMode) {
                const confirm = confirmPasswordInput.value.trim();
                const phone = phoneInput.value.trim();

                if (login.length < 6) {
                    showError(authError, '❌ Логин должен быть минимум 6 символов');
                    return;
                }
                if (password.length < 4) {
                    showError(authError, '❌ Пароль должен быть минимум 4 символа');
                    return;
                }
                if (password !== confirm) {
                    showError(authError, '❌ Пароли не совпадают');
                    return;
                }
                if (!phone) {
                    showError(authError, '❌ Введите телефон');
                    return;
                }
                if (state.users[login]) {
                    showError(authError, '❌ Пользователь уже существует');
                    return;
                }

                state.users[login] = { password, phone };
                saveData();
                showError(authSuccess, '✅ Регистрация успешна! Теперь войдите.');
                toggleMode();
                return;
            }

            // --- ВХОД ---
            if (login === 'admin' && password === 'admin123') {
                state.currentUser = 'admin';
                showUserScreen();
                return;
            }

            if (state.users[login]) {
                if (state.users[login].password === password) {
                    state.currentUser = login;
                    showUserScreen();
                    return;
                } else {
                    showError(authError, '❌ Неверный пароль');
                    return;
                }
            } else {
                showError(authError, '❌ Пользователь не найден');
            }
        }

        // ----- Добавить запись -----
        function handleAddRecord() {
            hideErrors();
            const roll = rollInput.value.trim();
            const warranty = warrantyInput.value.trim();

            if (!roll || !warranty) {
                showError(userError, '❌ Заполните все поля');
                return;
            }

            const newRecord = {
                id: Date.now().toString(),
                roll: roll,
                warranty: warranty,
                date: new Date().toLocaleDateString('ru-RU'),
                user: state.currentUser,
            };

            state.films.push(newRecord);
            saveData();
            rollInput.value = '';
            warrantyInput.value = '';
            renderRecords();
            alert('✅ Плёнка добавлена в архив!');
        }

        // ----- Отобразить записи -----
        function renderRecords() {
            const userFilms = state.films.filter(f => f.user === state.currentUser);
            userCount.textContent = userFilms.length;

            if (userFilms.length === 0) {
                userRecords.innerHTML = '<div style="color:#888; text-align:center; margin-top:20px;">Нет добавленных плёнок</div>';
                return;
            }

            userRecords.innerHTML = userFilms.map(item => `
                <div class="record">
                    <div class="record-roll">🎯 ${item.roll}</div>
                    <div class="record-warranty">🛡️ ${item.warranty}</div>
                    <div class="record-date">📅 ${item.date}</div>
                </div>
            `).join('');
        }

        // ----- Выход -----
        function logout() {
            state.currentUser = null;
            showAuthScreen();
            loginInput.value = '';
            passwordInput.value = '';
        }

        // ----- Демо QR -----
        function startScanner() {
            alert('📷 Демо-режим сканера. Введите номер рулона вручную.');
        }

        // ----- Инициализация -----
        function init() {
            showAuthScreen();

            authBtn.addEventListener('click', handleAuth);
            switchLink.addEventListener('click', toggleMode);

            // Вход по Enter
            loginInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuth(); });
            passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuth(); });
            confirmPasswordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuth(); });
            phoneInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleAuth(); });

            addRecordBtn.addEventListener('click', handleAddRecord);
            logoutBtn.addEventListener('click', logout);
            scanBtn.addEventListener('click', startScanner);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
