<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>ZR Kazakhstan</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, sans-serif; }
        body { background: #f5f0eb; color: #2d2a24; min-height: 100vh; padding: 16px; }
        .container { max-width: 500px; margin: 0 auto; }
        .card { background: #fff; border-radius: 20px; padding: 24px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
        .input { width: 100%; padding: 14px; border: 2px solid #e8e0d8; border-radius: 12px; background: #f8f5f0; font-size: 16px; margin-bottom: 12px; outline: none; }
        .input:focus { border-color: #c9a84c; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; color: #fff; background: #c9a84c; cursor: pointer; margin-bottom: 8px; }
        .btn-danger { background: #e74c3c; }
        .btn-success { background: #27ae60; }
        .btn-secondary { background: transparent; color: #c9a84c; border: 2px solid #c9a84c; }
        .error { background: rgba(231,76,60,0.1); color: #e74c3c; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .success { background: rgba(39,174,96,0.1); color: #27ae60; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .hidden { display: none; }
        .switch-link { text-align: center; margin-top: 16px; color: #c9a84c; cursor: pointer; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .logout-btn { width: 40px; height: 40px; border-radius: 50%; border: none; background: #e74c3c; color: #fff; font-size: 18px; cursor: pointer; }
        .record { background: #f8f5f0; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 4px solid #c9a84c; }
        .record-roll { font-size: 16px; font-weight: 600; }
        .record-warranty { font-size: 14px; color: #c9a84c; }
        .record-date { font-size: 12px; color: #888; }
        .user-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e8e0d8; }
        .user-item .user-status { font-size: 12px; padding: 2px 10px; border-radius: 20px; background: #27ae60; color: #fff; }
        .user-item .user-status.blocked { background: #e74c3c; }
        .stats { display: flex; justify-content: space-around; background: #f0ece6; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .stats-number { font-size: 22px; font-weight: bold; color: #c9a84c; }
        .stats-label { font-size: 11px; color: #888; }
        .phone-prefix { margin-right: 8px; font-weight: 600; }
        @media (prefers-color-scheme: dark) {
            body { background: #0a0a12; color: #e8e4de; }
            .card { background: #16161f; }
            .input { background: #222233; color: #e8e4de; border-color: #333355; }
            .record { background: #1a1a2e; }
            .stats { background: #1a1a2e; }
            .user-item { border-bottom-color: #2a2a40; }
        }
        .logo { text-align: center; margin-bottom: 20px; }
        .logo img { width: 100px; height: auto; border-radius: 50%; }
        .logo-text { font-size: 20px; font-weight: 700; color: #c9a84c; letter-spacing: 4px; margin-top: 8px; display: block; }
        .logo-sub { font-size: 13px; color: #888; letter-spacing: 2px; }
        .flex { display: flex; align-items: center; gap: 10px; }
        .flex-1 { flex: 1; }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; border-bottom: 2px solid #e8e0d8; }
        .tab-button { padding: 10px 16px; border: none; background: transparent; color: #888; font-size: 14px; font-weight: 500; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-button.active { color: #c9a84c; border-bottom-color: #c9a84c; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .btn-sm { padding: 8px 12px; font-size: 12px; width: auto; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://i.ibb.co.com/ynzbM3k4/77.jpg" alt="ZR Kazakhstan">
            <span class="logo-text">KAZAKHSTAN</span>
            <span class="logo-sub">Гарантия качества</span>
        </div>

        <!-- ===== АВТОРИЗАЦИЯ ===== -->
        <div id="authScreen">
            <div class="card">
                <div class="card-title" style="font-size:20px; font-weight:600; text-align:center; margin-bottom:16px;">🔐 Авторизация</div>
                <div id="authError" class="error hidden"></div>
                <div id="authSuccess" class="success hidden"></div>
                <input class="input" id="loginInput" placeholder="Логин (6+ символов)">
                <input class="input" id="passwordInput" placeholder="Пароль (8+ символов)" type="password">
                <div id="registerFields" class="hidden">
                    <input class="input" id="confirmPasswordInput" placeholder="Подтвердите пароль" type="password">
                    <div><span class="phone-prefix">+7</span><input class="input" id="phoneInput" placeholder="7001234567" type="tel" style="display:inline-block; width:calc(100% - 40px);"></div>
                </div>
                <button class="btn" id="authBtn">Войти</button>
                <div class="switch-link" id="switchLink">Нет аккаунта? Зарегистрироваться</div>
                <div style="text-align:center; margin-top:12px; font-size:13px; color:#888;">Админ: admin / admin123</div>
            </div>
        </div>

        <!-- ===== ПОЛЬЗОВАТЕЛЬ ===== -->
        <div id="userScreen" class="hidden">
            <div class="header">
                <div><div style="font-size:20px; font-weight:bold;">📦 Архив плёнок</div><div style="font-size:14px; color:#888;" id="userNameDisplay">👤 пользователь</div></div>
                <button class="logout-btn" id="userLogoutBtn">🚪</button>
            </div>
            <div class="card">
                <input class="input" id="rollInput" placeholder="Номер рулона">
                <input class="input" id="warrantyInput" placeholder="Номер гарантийного талона">
                <div id="userError" class="error hidden"></div>
                <button class="btn" id="addRecordBtn">➕ Добавить плёнку</button>
            </div>
            <div style="font-weight:600; margin:16px 0 10px;">📜 Мои плёнки (<span id="userCount">0</span>)</div>
            <div id="userRecords"></div>
        </div>

        <!-- ===== АДМИН ===== -->
        <div id="adminScreen" class="hidden">
            <div class="header">
                <div><div style="font-size:20px; font-weight:bold;">👑 Админ-панель</div></div>
                <button class="logout-btn" id="adminLogoutBtn">🚪</button>
            </div>
            <div class="tabs">
                <button class="tab-button active" data-tab="adminDashboard">📊 Дашборд</button>
                <button class="tab-button" data-tab="adminUsers">👥 Пользователи</button>
                <button class="tab-button" data-tab="adminCatalog">📦 Рулоны</button>
            </div>

            <div id="adminDashboard" class="tab-content active">
                <div class="stats">
                    <div><div class="stats-number" id="statUsers">0</div><div class="stats-label">👥 пользователей</div></div>
                    <div><div class="stats-number" id="statFilms">0</div><div class="stats-label">🎞️ регистраций</div></div>
                    <div><div class="stats-number" id="statCatalog">0</div><div class="stats-label">📦 рулонов</div></div>
                </div>
                <button class="btn btn-success" id="exportCSVBtn">📥 Экспорт CSV</button>
            </div>

            <div id="adminUsers" class="tab-content">
                <div class="card"><div id="adminUserList"></div></div>
            </div>

            <div id="adminCatalog" class="tab-content">
                <div class="card">
                    <div style="font-weight:600; margin-bottom:12px;">📦 Добавить рулон</div>
                    <input class="input" id="adminNewRoll" placeholder="Номер рулона (ZR-XXXX)">
                    <input class="input" id="adminNewName" placeholder="Название модели">
                    <input class="input" id="adminNewEndDate" placeholder="Дата окончания (2026-12-31)">
                    <button class="btn btn-success" id="adminAddCatalogBtn">➕ Добавить</button>
                </div>
                <div style="font-weight:600; margin:16px 0 10px;">📋 Справочник (<span id="catalogCount">0</span>)</div>
                <div id="adminCatalogList"></div>
            </div>
        </div>

        <!-- ===== МОДАЛКА ЗАБЫЛИ ПАРОЛЬ ===== -->
        <div id="forgotModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:10000; justify-content:center; align-items:center;">
            <div style="background:#fff; max-width:400px; width:90%; border-radius:20px; padding:24px;">
                <div style="font-size:20px; font-weight:600; margin-bottom:16px;">🔑 Восстановление</div>
                <input class="input" id="forgotLoginInput" placeholder="Ваш логин">
                <div id="forgotError" class="error hidden"></div>
                <button class="btn" id="forgotSubmitBtn">📧 Отправить</button>
                <button class="btn btn-secondary" id="forgotCloseBtn" style="margin-top:8px;">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // === ЕДИНСТВЕННОЕ ОБЪЯВЛЕНИЕ SUPABASE ===
        // ============================================
        const supabaseUrl = 'https://rbejdwshewypcnqidhdu.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJiZWpkd3NoZXd5cGNucWlkaGR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3ODI4NTcsImV4cCI6MjEwMTM1ODg1N30.KpxxcTJYW8CRmi78XMhxYU-WGGc5J80DBTrUbWUmwps';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // ============================================
        // ПРИЛОЖЕНИЕ
        // ============================================
        const state = { users: {}, films: [], catalog: [], currentUser: null, isAdmin: false, isRegister: false };
        const $ = id => document.getElementById(id);
        const authScreen = $('authScreen');
        const userScreen = $('userScreen');
        const adminScreen = $('adminScreen');
        const authError = $('authError');
        const authSuccess = $('authSuccess');
        const loginInput = $('loginInput');
        const passwordInput = $('passwordInput');
        const confirmPasswordInput = $('confirmPasswordInput');
        const phoneInput = $('phoneInput');
        const registerFields = $('registerFields');
        const authBtn = $('authBtn');
        const switchLink = $('switchLink');
        const userNameDisplay = $('userNameDisplay');
        const rollInput = $('rollInput');
        const warrantyInput = $('warrantyInput');
        const userError = $('userError');
        const addRecordBtn = $('addRecordBtn');
        const userCount = $('userCount');
        const userRecords = $('userRecords');
        const userLogoutBtn = $('userLogoutBtn');
        const adminLogoutBtn = $('adminLogoutBtn');
        const statUsers = $('statUsers');
        const statFilms = $('statFilms');
        const statCatalog = $('statCatalog');
        const adminNewRoll = $('adminNewRoll');
        const adminNewName = $('adminNewName');
        const adminNewEndDate = $('adminNewEndDate');
        const adminAddCatalogBtn = $('adminAddCatalogBtn');
        const catalogCount = $('catalogCount');
        const adminCatalogList = $('adminCatalogList');
        const adminUserList = $('adminUserList');
        const exportCSVBtn = $('exportCSVBtn');
        const forgotModal = $('forgotModal');
        const forgotLoginInput = $('forgotLoginInput');
        const forgotError = $('forgotError');
        const forgotSubmitBtn = $('forgotSubmitBtn');
        const forgotCloseBtn = $('forgotCloseBtn');

        function showError(el, msg) { el.textContent = msg; el.classList.remove('hidden'); }
        function showSuccess(el, msg) { el.textContent = msg; el.classList.remove('hidden'); }
        function hideErrors() { authError.classList.add('hidden'); authSuccess.classList.add('hidden'); userError.classList.add('hidden'); }

        async function loadUsers() {
            const { data } = await supabase.from('users').select('*');
            const users = {};
            data?.forEach(u => { users[u.login] = { password: u.password, phone: u.phone, blocked: u.blocked || false }; });
            return users;
        }
        async function loadFilms() {
            const { data } = await supabase.from('films').select('*');
            return data || [];
        }
        async function loadCatalog() {
            const { data } = await supabase.from('catalog').select('*');
            return data || [];
        }

        async function renderAdmin() {
            state.users = await loadUsers();
            state.films = await loadFilms();
            state.catalog = await loadCatalog();
            const userList = Object.keys(state.users);
            statUsers.textContent = userList.length;
            statFilms.textContent = state.films.length;
            statCatalog.textContent = state.catalog.length;
            adminUserList.innerHTML = userList.map(u => {
                const isBlocked = state.users[u].blocked;
                const filmsCount = state.films.filter(f => f.username === u).length;
                return `<div class="user-item">
                    <div><span class="user-name">👤 ${u}</span><span style="font-size:12px; color:#888;"> 📱 ${state.users[u].phone || '—'} | 📦 ${filmsCount} плёнок</span><br><span style="color:#c9a84c; font-size:13px;">🔑 ${state.users[u].password}</span></div>
                    <div><span class="user-status ${isBlocked ? 'blocked' : ''}">${isBlocked ? '🚫 Заблокирован' : '✅ Активен'}</span>
                    <button onclick="toggleBlock('${u}')" class="btn btn-sm ${isBlocked ? 'btn-success' : 'btn-danger'}" style="margin-left:8px;">${isBlocked ? 'Разблок' : 'Заблок'}</button></div>
                </div>`;
            }).join('');
            adminCatalogList.innerHTML = state.catalog.map(item =>
                `<div class="user-item"><div>📦 ${item.roll} — ${item.name} (до ${new Date(item.endDate).toLocaleDateString('ru-RU')})</div>
                <button onclick="deleteCatalog('${item.roll}')" style="background:none; border:none; font-size:20px; cursor:pointer; color:#e74c3c;">🗑️</button></div>`
            ).join('');
            catalogCount.textContent = state.catalog.length;
        }

        window.toggleBlock = async function(username) {
            if (username === 'admin') return alert('❌ Нельзя заблокировать админа');
            const current = state.users[username];
            if (!current) return;
            const newBlocked = !current.blocked;
            await supabase.from('users').update({ blocked: newBlocked }).eq('login', username);
            renderAdmin();
        };

        window.deleteCatalog = async function(roll) {
            if (!confirm('Удалить рулон ' + roll + '?')) return;
            await supabase.from('catalog').delete().eq('roll', roll);
            renderAdmin();
        };

        async function handleAuth() {
            hideErrors();
            const login = loginInput.value.trim();
            const password = passwordInput.value.trim();
            if (!login || !password) return showError(authError, '❌ Заполните все поля');

            if (state.isRegister) {
                const phone = phoneInput.value.trim();
                const confirm = confirmPasswordInput.value.trim();
                if (login.length < 6) return showError(authError, '❌ Логин минимум 6 символов');
                if (password.length < 8) return showError(authError, '❌ Пароль минимум 8 символов');
                if (password !== confirm) return showError(authError, '❌ Пароли не совпадают');
                if (phone.length < 10) return showError(authError, '❌ Введите телефон');
                const { error } = await supabase.from('users').insert([{ login, password, phone, blocked: false }]);
                if (error) return showError(authError, error.code === '23505' ? '❌ Логин занят' : '❌ Ошибка: ' + error.message);
                showSuccess(authSuccess, '✅ Регистрация успешна! Войдите.');
                toggleMode();
                return;
            }

            if (login === 'admin' && password === 'admin123') {
                state.currentUser = 'admin';
                state.isAdmin = true;
                adminScreen.classList.remove('hidden');
                authScreen.classList.add('hidden');
                userScreen.classList.add('hidden');
                renderAdmin();
                return;
            }

            const { data } = await supabase.from('users').select('*').eq('login', login).maybeSingle();
            if (!data) return showError(authError, '❌ Пользователь не найден');
            if (data.blocked) return showError(authError, '🚫 Аккаунт заблокирован');
            if (data.password !== password) return showError(authError, '❌ Неверный пароль');
            state.currentUser = login;
            state.isAdmin = false;
            userScreen.classList.remove('hidden');
            authScreen.classList.add('hidden');
            adminScreen.classList.add('hidden');
            userNameDisplay.textContent = '👤 ' + login;
            renderUserRecords();
        }

        function toggleMode() {
            state.isRegister = !state.isRegister;
            authBtn.textContent = state.isRegister ? 'Зарегистрироваться' : 'Войти';
            switchLink.textContent = state.isRegister ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
            registerFields.classList.toggle('hidden');
            hideErrors();
        }

        async function renderUserRecords() {
            state.films = await loadFilms();
            const userFilms = state.films.filter(f => f.username === state.currentUser);
            userCount.textContent = userFilms.length;
            userRecords.innerHTML = userFilms.map(item =>
                `<div class="record"><div class="record-roll">🎯 ${item.roll}</div><div class="record-warranty">🛡️ ${item.warranty}</div><div class="record-date">📅 ${item.date}</div></div>`
            ).join('') || '<div style="color:#888; text-align:center;">Нет плёнок</div>';
        }

        async function handleAddRecord() {
            userError.classList.add('hidden');
            const roll = rollInput.value.trim();
            const warranty = warrantyInput.value.trim();
            if (!roll || !warranty) return showError(userError, '❌ Заполните все поля');
            const catalogItem = state.catalog.find(c => c.roll === roll);
            if (!catalogItem) return showError(userError, '❌ Рулон не найден в системе');
            const existing = state.films.find(f => f.roll === roll);
            if (existing) return showError(userError, '❌ Рулон уже зарегистрирован');
            await supabase.from('films').insert([{ id: Date.now().toString(), roll, warranty, date: new Date().toLocaleString('ru-RU'), username: state.currentUser, endDate: catalogItem.endDate }]);
            rollInput.value = '';
            warrantyInput.value = '';
            renderUserRecords();
            alert('✅ Плёнка добавлена!');
        }

        function logout() {
            state.currentUser = null;
            state.isAdmin = false;
            authScreen.classList.remove('hidden');
            userScreen.classList.add('hidden');
            adminScreen.classList.add('hidden');
        }

        async function exportCSV() {
            state.films = await loadFilms();
            let csv = 'Пользователь,Телефон,Пароль,Рулон,Гарантия,Дата,Окончание\n';
            state.films.forEach(f => {
                const user = state.users[f.username] || {};
                const info = state.catalog.find(c => c.roll === f.roll);
                csv += `${f.username},${user.phone || '—'},${user.password || '—'},${f.roll},${f.warranty},${f.date},${info ? info.endDate : '—'}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'zr-export.csv';
            a.click();
        }

        function showForgotModal() { forgotModal.style.display = 'flex'; forgotLoginInput.value = ''; forgotError.classList.add('hidden'); }
        function handleForgot() {
            const login = forgotLoginInput.value.trim();
            if (!login) return showError(forgotError, '❌ Введите логин');
            alert('📧 Запрос отправлен администратору!');
            forgotModal.style.display = 'none';
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        document.addEventListener('DOMContentLoaded', async () => {
            authBtn.addEventListener('click', handleAuth);
            switchLink.addEventListener('click', toggleMode);
            loginInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
            passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleAuth(); });
            addRecordBtn.addEventListener('click', handleAddRecord);
            userLogoutBtn.addEventListener('click', logout);
            adminLogoutBtn.addEventListener('click', logout);
            adminAddCatalogBtn.addEventListener('click', async () => {
                const roll = adminNewRoll.value.trim(), name = adminNewName.value.trim(), endDate = adminNewEndDate.value.trim();
                if (!roll || !name || !endDate) return alert('❌ Заполните все поля');
                if (state.catalog.find(c => c.roll === roll)) return alert('❌ Рулон уже есть');
                await supabase.from('catalog').insert([{ roll, name, endDate }]);
                adminNewRoll.value = ''; adminNewName.value = ''; adminNewEndDate.value = '';
                renderAdmin();
                alert('✅ Рулон добавлен');
            });
            exportCSVBtn.addEventListener('click', exportCSV);
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                    document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                    document.getElementById(this.dataset.tab).classList.add('active');
                    this.classList.add('active');
                });
            });
            forgotSubmitBtn.addEventListener('click', handleForgot);
            forgotCloseBtn.addEventListener('click', () => forgotModal.style.display = 'none');
            state.users = await loadUsers();
            state.catalog = await loadCatalog();
        });
    </script>
</body>
</html>
